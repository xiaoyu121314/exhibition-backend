; 原生 RTSP 拉流 + WebRTC，只发送 H.264 视频，不录制。 @author MoShangHuaKai
[api]
apiDebug=0
secret=@ZLM_SECRET@

[general]
; WebRTC 媒体必须允许局域网连接；HTTP 管理入口单独使用 IP 白名单。
listen_ip=0.0.0.0
enableVhost=0
streamNoneReaderDelayMS=60000

[http]
port=9999
sslport=0
allow_ip_range=127.0.0.1,::1
dirMenu=0

[rtc]
; 必须填写浏览器可达的本机局域网 IPv4，不能填摄像头 IP 或虚拟网卡 IP。
externIP=@RTC_ADDRESS@
port=8000
tcpPort=8000
preferredCodecV=H264

[protocol]
; WebRTC 播放使用内部 RTSP 媒体源，下面不代表开放 RTSP 监听端口。
enable_rtsp=1
enable_hls=0
enable_hls_fmp4=0
enable_mp4=0
enable_audio=0
add_mute_audio=0
enable_rtmp=0
enable_ts=0
enable_fmp4=0

[hook]
enable=0

[rtsp]
port=0
sslport=0

[rtmp]
port=0
sslport=0

[shell]
port=0

[onvif]
port=0

[rtp_proxy]
port=0
